[project]
name = "project-sekai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "numba>=0.68.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]
