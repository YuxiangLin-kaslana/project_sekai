# 地形。yields 是"开发后产出"：格子上建了对应设施才产出，未开发的格子没有产出。
# move_cost: null = 不可通行；水域的 move_cost 是舰船的移动消耗。
# defense: 防御加成，百分比整数；attack: 从这格出击的进攻修正（居高临下 +、泥沼雨林 −）。数值为初始草案。

plains:
  name: 平原
  move_cost: 1
  yields: { food: 1, production: 1 }
  color: "#b3ad6c"

