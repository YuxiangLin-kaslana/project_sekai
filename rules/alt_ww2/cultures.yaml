# 文化（engine/systems/culture.py）：大类 family 是东方 east / 西方 west（和 names.yaml 的名字系列对应），
# 下面分小类。国家模板在 nations.yaml 里写 subculture；名字库（names.yaml）里的国名写在这里的 nations 下；
# 都没写到的国名，按国名在同一大类的小类里确定地分一个。分裂出来的新政权继承文化（见 engine/systems/secession.py）。
# 外交：同小类的国家关系好，同大类其次，不同大类差——关系目标值上的加减项（见 engine/systems/diplomacy.py）。

# ---- 东方
zhongyuan:
  name: 中原
  family: east
  nations: [大夏帝国, 北燕王朝, 华胥国, 玄武王朝, 天穹帝国, 白虎王朝, 凤翔共和国]
