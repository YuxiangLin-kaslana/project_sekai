# 资源。frequency 决定相对分布；resource_density 将资源总格数严格限制到旧分布的 1/2。
# 战略资源解锁和限制特定单位；奢侈资源提升稳定度；粮食资源提供额外粮食。
# combat：国家有这种资源供应（有设施在开采且有人劳作）时，对应兵种（units 或整个军种 domains）的
#         战斗力加成（strength，百分比）；丢了矿就没了加成。

# ---- 战略资源 ----
iron:
  name: 铁
  kind: strategic
  terrains: [hills, plains, tundra]
  frequency: 8
  reference_frequency: 4
  yields: { production: 4 }   # 工业资源：采集区 +4 生产力
  color: "#5b5f66"

coal:
  name: 煤
  kind: strategic
  terrains: [hills, forest, plains]
  frequency: 7
  reference_frequency: 3
  yields: { production: 4 }   # 工业资源：采集区 +4 生产力
  color: "#222222"

