# 二战剧本的科技树（1936–1945，三个时代）。科研值每回合投进当前研究，研完给对应兵种战斗力加成
# （strength：units 或整个军种 domains，百分比）。科技不解锁东西：所有兵种、建筑、区域开局就能造。
# start: true 的科技开局就有。

# ---- 1936 战前 ----
conscription:
  name: 征兵制
  era: prewar
  cost: 1
  start: true
  description: 开局科技。

infantry_tactics:
  name: 步兵战术
  era: prewar
  cost: 40
  strength:
    - { label: 步兵战术, units: [infantry, motorized], strength: 10 }
  description: 步兵、摩托化步兵战斗力 +10%。

field_artillery:
  name: 野战炮兵
  era: prewar
  cost: 45
  strength:
    - { label: 野战炮兵, units: [artillery], strength: 10 }
  description: 炮兵战斗力 +10%。

naval_engineering:
  name: 造舰工程
  era: prewar
  cost: 50
  strength:
    - { label: 造舰工程, domains: [sea], strength: 10 }
  description: 所有舰船战斗力 +10%。

aviation:
  name: 早期航空
  era: prewar
  cost: 55
  strength:
    - { label: 早期航空, domains: [air], strength: 10 }
  description: 所有飞机战斗力 +10%。

anti_aircraft:
  name: 防空火炮
  era: prewar
  cost: 45
  strength:
    - { label: 防空火炮, units: [anti_air], strength: 15 }
  description: 高射炮战斗力 +15%。

motorization:
