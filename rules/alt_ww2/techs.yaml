# 二战剧本的科技树（草案，1936–1945，三个时代）。科研值每回合投进当前研究，研完解锁 unlocks 里的
# 兵种、建筑、区域；没被任何科技解锁的东西开局就能造。start: true 的科技开局就有。
# strength：兵种战斗力加成（units 或整个军种 domains）；unit_cost：全国造兵花费 %；science：全国科研 +%。

# ---- 1936 战前 ----
conscription:
  name: 征兵制
  era: prewar
  cost: 1
  start: true
  unlocks: [infantry, settler, engineer, recon, artillery]
  description: 步兵、炮兵、侦察部队、开拓者和工兵。

motorization:
  name: 摩托化
  era: prewar
  cost: 40
  requires: [conscription]
  unlocks: [motorized]
  description: 摩托化步兵。

industrialization:
  name: 工业化
  era: prewar
  cost: 40
  unlocks: [factory, workshop]
  description: 工厂区域和工场。

radio:
  name: 无线电
  era: prewar
  cost: 45
  unlocks: [research, school]
  description: 科研中心和学校。

naval_engineering:
  name: 造舰工程
  era: prewar
  cost: 50
  unlocks: [destroyer, transport]
  description: 驱逐舰队和运输船。

anti_aircraft:
  name: 防空火炮
  era: prewar
  cost: 50
  unlocks: [anti_air]
  description: 高射炮营。

aviation:
  name: 早期航空
  era: prewar
  cost: 60
  requires: [motorization]
  unlocks: [airfield, fighter]
  description: 机场和战斗机联队。

petrochemistry:
  name: 石油化工
  era: prewar
  cost: 60
  requires: [industrialization]
  unlocks: [oil_well]
  description: 油田（陆上、海上）。

mobilization:
  name: 总动员
  era: prewar
  cost: 70
  requires: [conscription]
  unlocks: [military_base, barracks, general]
  description: 军事基地、兵营和将领。

# ---- 1940 战争中期 ----
armored_warfare:
  name: 装甲战
  era: midwar
  cost: 130
  requires: [motorization, petrochemistry]
  unlocks: [armor]
  description: 装甲师（坦克）。

strategic_bombing:
  name: 战略轰炸
  era: midwar
  cost: 140
  requires: [aviation]
  unlocks: [bomber]
  description: 轰炸机联队。

cruisers:
  name: 巡洋舰
  era: midwar
  cost: 120
  requires: [naval_engineering]
  unlocks: [cruiser]
  description: 巡洋舰队。

naval_command:
  name: 海军指挥
  era: midwar
  cost: 110
  requires: [naval_engineering]
  unlocks: [admiral]
  description: 海军将领（舰队）。

carriers:
  name: 航空母舰
  era: midwar
  cost: 170
  requires: [cruisers, aviation]
  unlocks: [carrier]
  description: 航空母舰编队。

fortification:
  name: 筑垒
  era: midwar
  cost: 100
  requires: [mobilization]
  unlocks: [walls]
  description: 城防工事。

radar:
  name: 雷达
  era: midwar
  cost: 130
  requires: [radio, anti_aircraft]
  strength:
    - { label: 雷达预警, units: [anti_air, fighter], strength: 15 }
  description: 高射炮、战斗机战斗力 +15%。

# ---- 1943 战争后期 ----
battleships:
  name: 战列舰
  era: latewar
  cost: 220
  requires: [cruisers]
  unlocks: [battleship]
  description: 战列舰队。

heavy_armor:
  name: 重型坦克
  era: latewar
  cost: 240
  requires: [armored_warfare]
  strength:
    - { label: 重型坦克, units: [armor], strength: 20 }
  description: 坦克战斗力 +20%。

jet_engine:
  name: 喷气发动机
  era: latewar
  cost: 260
  requires: [strategic_bombing, radar]
  strength:
    - { label: 喷气发动机, domains: [air], strength: 20 }
  description: 所有飞机战斗力 +20%。

mass_production:
  name: 大规模生产
  era: latewar
  cost: 220
  requires: [industrialization, mobilization]
  unit_cost: 85
  description: 全国造兵花费 −15%。

proximity_fuze:
  name: 近炸引信
  era: latewar
  cost: 200
  requires: [radar]
  strength:
    - { label: 近炸引信, units: [anti_air, destroyer, cruiser, battleship], strength: 20 }
  description: 高射炮和战舰战斗力 +20%。

computing:
  name: 电子计算
  era: latewar
  cost: 260
  requires: [radar]
  science: 25
  description: 全国科研 +25%。
