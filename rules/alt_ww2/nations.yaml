# 国家模板（架空）。开局按顺序取用：第 n 个起始点 = 第 n 个国家；城市名的第一个是首都。
# culture：名字系列（east 东方 / west 西方，默认 west），也是文化大类；subculture：文化小类（cultures.yaml，
# 影响外交关系）。模板的城市名用完后，从 names.yaml 里同系列的城市名库取没用过的名字；国家模板用完后，
# 新国家从名字库取国名。颜色用于领土、单位牌底色，尽量互相区分。

