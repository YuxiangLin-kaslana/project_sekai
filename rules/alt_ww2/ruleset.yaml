name: alt_ww2
extends: _world          # 地形与世界生成共用 rules/_world/（所有剧本相同）
version: 0.1.0
title: 架空近现代（二战）
description: 第一个内置剧本。二战式的近现代背景，陆海空军并存；国家与地名均为架空。

cities:
  radius: 2               # 建城时辖区半径（约 19 格）
  max_radius: 5           # 仅用于压力测试初始填充
  territory_cap: 4        # 人口增长时辖区半径最多 4 格（按地图尺度放大：128×80 约 6 格，800×460 约 38 格）
  coastal_waters: 2       # 辖区只划离城 2 格以内的近岸海面（同样按地图尺度放大），外海不算领土
  min_distance: 5         # 两座城市之间至少隔 5 格（按地图尺度放大）
  dense_distance: 4       # 富饶地区（周边潜力 ≥60）城市更密：隔 4 格
  sparse_distance: 7      # 贫瘠地区（周边潜力 <28）稀疏：隔 7 格
  capacity_per_city: 14   # 承载区每 1400 点地块潜力（× s²）一个建城名额：名额跟着地力走
  center_yields: { food: 3, production: 3, gold: 2, science: 1 }   # 市中心本身：3 粮食、3 生产力（另有少量税收和科研）
  center_housing: 3        # 市中心给 3 住房；人口上限 = 住房 − 被征召走的人口
  growth: [8, 3, 1.3]      # 长一口人要 8 + 3n + n^1.3 存粮（人口就是兵源，比默认曲线平）
  population: 1           # 新城人口
  capital_population: 2   # 开局首都人口
  production_per_pop: 50  # 维持人口：每个人口每回合吃 1 粮食、耗 0.5 生产力（这里按百分之一点写）
  gold_per_production: 2  # 城市开启"金币补足建设"时，基础设施（城外设施、市中心建筑）缺的生产力按 2 金 1 点补
  melee_reduction: 30     # 城防让近战攻城的伤害 −30%（原来 −70%，近战几乎打不动城，只能干等炮兵）

eras:                     # 时代（科技树 techs.yaml 按时代分）
  - { id: prewar, name: 战前, year: 1936 }
  - { id: midwar, name: 战争中期, year: 1940 }
  - { id: latewar, name: 战争后期, year: 1943 }

industry:                 # 有煤又有铁（都在开采）：全国工厂产值 +15%
  requires: [coal, iron]
  buildings: [factory]
  percent: 15

stacking:                 # 一个格子最多放 3 个单位（地表的军事 + 平民合计）；敌我不能同格（近战从相邻格打）
  limits: { military: 3, civilian: 3, air: 3 }      # 每格：地表军事 / 地表平民 / 空域（飞机在空中另算）
  city_bonus: { military: 0, civilian: 0, air: 0 }  # 城市不能停飞机（只有机场、航母能起降）；地表单位按城里最多 4 个（cities.max_units）
  total: 3                # 地表单位合计最多 3 个
  crowding_from: 3        # 同格军事单位超过 3 个才拥挤（上限就是 3，不会拥挤）
  crowding_penalty: 10    # 每多 1 个，该格所有单位战斗力 −10%

encirclement:             # 包围 = 断补给：四周能站人的相邻格都是敌军、敌国城市，或没有本方部队的敌方控制区
  penalty: 50             # 被包围的部队攻击力只剩 50%（驻守也不回血）
  damage_taken: 200       # 被包围的部队 / 城市受到的伤害 ×2
  attrition: 10           # 被包围的部队每回合减员 10 点生命，减到 0 溃散
  city_penalty: 50        # 被包围的城市攻击力只剩 50%，城防不回复

tactics:                  # 战术修正（进攻方）；地形本身的攻防修正在 terrain.yaml 的 attack / defense
  flank: 30               # 侧击：从目标的侧面打 +30%（每个单位有朝向，见 engine/systems/zoc.py）
  rear: 80                # 背击：从目标背后打 +80%
  river: 50               # 隔着河进攻 −50%（飞机不受影响）
  attack_cost: 1          # 攻击花 1 点移动力：可以先移动再攻击（剩下 ≥1 点就能打），攻击用掉剩余移动力，一回合打一次

embark:                   # 陆军下海（没有运输船）：下海、上岸各花一整回合（要满移动力，走一步就用完）
  moves: 7                # 在海上每回合移动力 7（随地图放大，和舰船一样）
  defense: 25             # 在海上没有攻击力，防御力只剩 25%（不吃地形、驻守加成）
  damage_taken: 300       # 在海上受到的伤害 ×3（血量相当于只剩 1/3）：要本方战舰同格护航，敌人先打战舰

army:
  upkeep_percent: 150     # 军事单位维护费是单位表数值的 1.5 倍

domain_damage:            # 军种克制：攻方军种 → 目标军种的伤害倍率（%），乘在兵种自己的伤害倍率上
  sea: { land: 150 }      # 舰炮打岸上部队 ×1.5
  land: { sea: 50 }       # 陆军（和城市防御射击）打舰船 ×0.5
  air: { sea: 160 }       # 飞机打舰船 ×1.6

generals:                 # 将领：城市花大量生产力造出来，星级出生时抽签
  weights: [40, 30, 18, 9, 3]   # ★1…★5 的抽中权重（%）
  bonus_per_rank: 10      # 军团成员在将领身边作战：每颗星战斗力 +10%（★5 +50%）
  base_capacity: 15       # 统御部队数 = 15 + 每星 2（★1 17 支 … ★5 25 支；军团最多 25 支）
  capacity_per_rank: 2
  radius: 4               # 将领身边 4 格内的成员有加成；编入军团也要在这个范围里

morale:                   # 兵力悬殊：交战双方各比本国 / 对方的城市数和军队数，取较低的那项比例
  start: 50               # 不到对方一半开始掉士气
  full: 25                # 只有对方四分之一时掉满
  max_penalty: 30         # 战斗力最多 −30%（城市防御也算）

stability:                # 城市稳定度 0–100：缺粮 / 缺钱 / 缺生产力时下降，降到 0 独立
  food: 4                 # 本城粮食入不敷出：每回合 −4
  gold: 3                 # 国库为负（付不起维护费）：全国城市每回合 −3
  production: 3           # 人口维持把生产力吃光：每回合 −3
  recover: 2              # 三样都不缺：每回合 +2，最多 100
  unrest: 30              # 低于 30 算动荡：周围有城市独立时一起独立
  captured: 70            # 刚被占领的城市从 70 开始
  independent: 60         # 独立后新政权从 60 开始
  radius: 6               # “周围”：离独立城市 6 格以内（按地图尺度放大），一起独立的城市再往外看
  start_gold: 20          # 新国家每座城带 20 金起家
  attacked: 3             # 战争：本回合城防挨打 −3
  occupied: 1             # 战争：辖区内有外国军队 −1
  encircled: 3            # 战争：城市被包围 −3
  weariness: 1            # 战争：本国本回合阵亡 3 支以上（weariness_losses），全国城市 −1（厌战）
  weariness_losses: 3
  garrison: 67            # 有本国驻军（城里有陆军，或辖区内有驻守的陆军）：下降减少 67%，至少仍掉 1
  conquest: 1             # 过度扩张：被攻占后 25 回合内每回合 −1（新占领，民心未附）
  conquest_turns: 25
  overextension: 1        # 城市超过 10 座时，离首都 10 格（按地图尺度放大）以外的城每两回合 −1
  empire_size: 10
  far: 10
  isolated: 2             # 孤城：陷在外国境内、和本国主体不连着的飞地城市，被包围得越严实越容易挨（满了约每回合八成），
                          # 每次 −2；降到 0 时归附包围它的国家（不独立成小国），国土连成一片
  decay: 2                # 大一统之后的衰落：占天下七成以上越多越容易积累腐败（一统天下时每回合 +2）；超过 80 点后离首都最远的
  decay_start: 80         # 城市每回合 −1（离心），范围从最远的一成逐渐扩大到六成 → 若干年后内战、军阀割据，
  decay_spread: 150       # 重新分裂（分久必合，合久必分）

pillage:                  # 军队破坏外国领土上的设施 / 道路（站在那一格，用掉本回合行动）
  loot: 25                # 掠走设施造价的 25%（金币）
  road_loot: 5            # 没有设施时拆掉连到这一格的外国道路，每段掠走 5 金
  stability: 5            # 所属城市稳定度 −5

healing:                  # 回血：本回合挨过打（包括被炮击压制）、进攻过、被包围的不回血
  city: 12                # 在本国城市里每回合回生命上限的 12%（不用驻守；步兵 180 → +21）
  field: 6                # 在郊外驻守每回合回生命上限的 6%

start:                    # 开局：每个国家一座首都 + 这些单位
  gold: 100
  buildings: [palace]
  facilities: 2           # 首都辖区内预先开发的设施数
  districts: [airfield]   # 首都自带一座机场（开局的飞机停在这里；城市本身不能停飞机）
  units: [infantry, infantry, recon, engineer, settler]
  coastal_units: [destroyer]   # 首都临水才给
  air_units: [fighter]
