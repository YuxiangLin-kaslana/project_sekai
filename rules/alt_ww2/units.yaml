# 单位。数值为初始草案（企划书 6.3 的 MVP 单位类别），具体平衡等批量对局后再调。
#   layer: surface 地表 | air 空域；domain: land 陆军 | sea 舰船 | air 航空；category: military | civilian
#   strength 近战战斗力；ranged_strength / range 远程战斗力与射程（航空单位的 range 是作战半径）
#   moves 每回合移动力；sight 视野；cost 生产力；population 带走的人口（都是 1：每个单位永久占城市一个人口上限）；gold 一次性金钱；
#   upkeep 每回合金钱维护费；hp 生命上限（默认 100）
#   short 单位牌上的简称；icon 单位牌上的兵种符号（前端内置，北约军标风格）
#   damage_vs_units / damage_vs_city 打部队 / 打城市的伤害倍率（百分比，默认 100）：炮兵削城防强、打部队弱
#   torpedo 鱼雷（驱逐舰）：只打舰船，射程 range，近距离伤害很高
#   陆军（军事单位、平民）都能自己下海渡海，没有运输船：下海、上岸各花一整回合，在海上没有攻击力、血量极低，
#   要战舰同格护航（规则集 embark，engine/systems/naval.py）
#   air_capacity 航空母舰能搭载几支飞机（移动机场：飞机转场到航母上，随舰航行、从航母出击）
#   flak / flak_range 舰艇自带防空：敌机飞进、飞出防空圈时各开火一次（不能主动攻击）
#   anti_air 防空火力：只能打飞机（主动射击 range 内的敌方航空单位）；range 内的格子挨敌方空袭时，
#            先对来袭飞机开火（高射火力），飞机带伤再投弹，血打光就被击落、炸不到目标
#   tags 能力标签：found_city 建城、build_facility 建设施、scout 侦察、siege 攻城、
#        area_damage 范围伤害（炮击伤到目标格里的所有敌军，城市也算）、
#        indirect 间接射击（抛射，开炮不需要视线，山脉树林挡不住）、
#        suppress 压制（打中的部队失去驻守加成，炮击波及的整格都算）……

