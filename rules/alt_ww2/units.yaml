# ---- 海军 ----
# 三级战舰：驱逐（快、鱼雷近战）→ 巡洋（中速、舰炮 2 格）→ 战列（慢、重炮 3 格、炮击整格）；
# 没有运输船：陆军自己下海渡海，战舰和它同格护航（敌人要先打掉战舰）。航空母舰靠舰载机群作战。
# 舰船航速是陆军的好几倍（原定数值的 1.8 倍）。
destroyer:
  name: 驱逐舰队
  short: 驱
  domain: sea
  strength: 10
  torpedo: 28    # 鱼雷：只打舰船（海上的陆军也算），近距离伤害很高
  deck_gun: 10   # 甲板炮：打岸上的部队和城市
  range: 2
  damage_vs_units: 155
  moves: 13      # 最快的战舰：跟得上下了海的陆军护航，对手海军多时直接上驱逐舰
  sight: 3
  cost: 135
  population: 1
  gold: 40
  upkeep: 2
  flak: 6    # 舰载防空：敌机进 / 出 2 格防空圈各挨一次（舰艇防空弱，要靠战斗机）
  icon: destroyer

cruiser:
  name: 巡洋舰队
  short: 巡
  domain: sea
  strength: 14
  ranged_strength: 16
  range: 3
  damage_vs_city: 170   # 舰炮削城防
  moves: 9
  sight: 3
